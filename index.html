<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Guardián - Diario Escolar</title>
    <meta name="description" content="Ediciones digitales del diario escolar El Guardián. La noticia bajo vigilancia.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#3b82f6',
                            DEFAULT: '#1d4ed8',
                            dark: '#1e3a8a',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Scrollbar Customization */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* Animations */
        .animate-delay-100 {
            animation-delay: 100ms;
        }

        .animate-delay-200 {
            animation-delay: 200ms;
        }

        .animate-delay-300 {
            animation-delay: 300ms;
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .pdf-container {
            height: calc(100vh - 120px);
            width: 100%;
        }

        .glass-morphism {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ── Hamburger Button ── */
        .hamburger-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 44px;
            height: 44px;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .hamburger-btn:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .hamburger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background: #f8fafc;
            border-radius: 2px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
        }

        /* X state */
        .hamburger-btn.is-open span:nth-child(1) {
            transform: translateY(8px) rotate(45deg);
        }
        .hamburger-btn.is-open span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .hamburger-btn.is-open span:nth-child(3) {
            transform: translateY(-8px) rotate(-45deg);
        }

        /* ── Mobile Menu Overlay ── */
        .mobile-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0);
            z-index: 48;
            pointer-events: none;
            transition: background 0.3s ease;
        }
        .mobile-overlay.is-open {
            background: rgba(0, 0, 0, 0.55);
            pointer-events: all;
        }

        /* ── Mobile Drawer ── */
        .mobile-drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100dvh;
            width: min(320px, 85vw);
            z-index: 49;
            background: rgba(15, 23, 42, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            transform: translateX(100%);
            transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }
        .mobile-drawer.is-open {
            transform: translateX(0);
        }

        .mobile-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .mobile-nav-links {
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 4px;
            flex: 1;
        }

        .mobile-nav-links button {
            text-align: left;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #cbd5e1;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-nav-links button:hover,
        .mobile-nav-links button.active {
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
        }

        .mobile-nav-links button .nav-icon {
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
        }

        .mobile-drawer-footer {
            padding: 20px 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .mobile-contact-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 14px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(29, 78, 216, 0.35);
        }

        .mobile-contact-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(29, 78, 216, 0.45);
        }
    </style>

    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="min-h-screen selection:bg-brand/30">
    <div id="root">
        <!-- Loader inicial -->
        <div class="flex items-center justify-center min-h-screen">
            <div class="animate-pulse flex flex-col items-center">
                <div class="w-16 h-16 bg-brand rounded-full mb-4"></div>
                <p class="text-slate-400">Cargando El Guardián...</p>
            </div>
        </div>
    </div>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Header = ({ onHome, onNavigate, currentView, currentDiario }) => {
            const [menuOpen, setMenuOpen] = useState(false);

            const handleNav = (action) => {
                setMenuOpen(false);
                action();
            };

            const navItems = [
                { label: 'Inicio',        icon: '🏠', action: onHome,                   view: 'archive' },
                { label: 'Más',           icon: '📂', action: () => onNavigate('mas'),  view: 'mas'     },
                { label: 'Quiénes Somos', icon: '👥', action: () => onNavigate('about'), view: 'about'  },
            ];

            return (
                <>
                    <header className="fixed top-0 left-0 right-0 z-50 glass py-4 px-6 md:px-12 flex items-center justify-between">
                        <div
                            className="flex items-center gap-3 cursor-pointer group"
                            onClick={() => handleNav(onHome)}
                        >
                            <div className="w-10 h-10 bg-brand rounded-lg flex items-center justify-center font-bold text-xl group-hover:rotate-12 transition-transform shadow-lg shadow-brand/20">G</div>
                            <h1 className="text-xl md:text-2xl font-bold tracking-tight uppercase">EL GUARDIÁN</h1>
                        </div>

                        {/* Desktop nav */}
                        <nav className="hidden md:flex gap-8 text-sm font-medium text-slate-300">
                            {navItems.map(item => (
                                <button
                                    key={item.view}
                                    onClick={item.action}
                                    className={`hover:text-brand transition-colors ${currentView === item.view ? 'text-brand font-bold' : ''}`}
                                >
                                    {item.label}
                                </button>
                            ))}
                            {currentDiario && <span className="text-slate-600">/</span>}
                            {currentDiario && <button className="text-brand font-bold capitalize">{currentDiario.name}</button>}
                        </nav>

                        <div className="flex items-center gap-3">
                            {/* Desktop contact button */}
                            <button
                                onClick={() => onNavigate('contact')}
                                className={`hidden md:block bg-brand hover:bg-brand-dark px-6 py-2 rounded-full text-sm font-semibold transition-all shadow-lg shadow-brand/20 ${currentView === 'contact' ? 'ring-2 ring-white/50' : ''}`}
                            >
                                Contacto
                            </button>

                            {/* Hamburger button — mobile only */}
                            <button
                                id="hamburger-btn"
                                className={`hamburger-btn md:hidden ${menuOpen ? 'is-open' : ''}`}
                                onClick={() => setMenuOpen(o => !o)}
                                aria-label="Abrir menú"
                                aria-expanded={menuOpen}
                            >
                                <span></span>
                                <span></span>
                                <span></span>
                            </button>
                        </div>
                    </header>

                    {/* Dark overlay */}
                    <div
                        className={`mobile-overlay ${menuOpen ? 'is-open' : ''}`}
                        onClick={() => setMenuOpen(false)}
                        aria-hidden="true"
                    />

                    {/* Slide-in drawer */}
                    <nav
                        id="mobile-menu"
                        className={`mobile-drawer ${menuOpen ? 'is-open' : ''}`}
                        aria-label="Menú de navegación"
                    >
                        <div className="mobile-drawer-header">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-brand rounded-lg flex items-center justify-center font-bold text-sm">G</div>
                                <span className="font-bold text-base uppercase tracking-tight">El Guardián</span>
                            </div>
                            <button
                                onClick={() => setMenuOpen(false)}
                                className="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors text-xl"
                                aria-label="Cerrar menú"
                            >
                                ✕
                            </button>
                        </div>

                        <div className="mobile-nav-links">
                            {navItems.map(item => (
                                <button
                                    key={item.view}
                                    onClick={() => handleNav(item.action)}
                                    className={currentView === item.view ? 'active' : ''}
                                >
                                    <span className="nav-icon">{item.icon}</span>
                                    {item.label}
                                </button>
                            ))}
                            <button
                                onClick={() => handleNav(() => onNavigate('contact'))}
                                className={currentView === 'contact' ? 'active' : ''}
                            >
                                <span className="nav-icon">✉️</span>
                                Contacto
                            </button>

                            {currentDiario && (
                                <div className="mt-4 px-4 py-3 rounded-xl bg-brand/10 border border-brand/20">
                                    <p className="text-xs text-slate-500 uppercase tracking-wider mb-1">Viendo</p>
                                    <p className="text-brand font-bold capitalize text-sm">{currentDiario.name}</p>
                                </div>
                            )}
                        </div>

                        <div className="mobile-drawer-footer">
                            <p className="text-xs text-center text-slate-600 mb-3">La noticia bajo vigilancia</p>
                        </div>
                    </nav>
                </>
            );
        };

        const AboutPage = () => (
            <div className="animate-fade-in max-w-4xl mx-auto">
                <section className="mb-16 text-center">
                    <h2 className="text-4xl md:text-6xl font-bold mb-6">
                        Quiénes <span className="gradient-text">Somos</span>
                    </h2>
                    <p className="text-slate-400 text-lg md:text-xl leading-relaxed">
                        El Guardián es un proyecto periodístico escolar dedicado a informar con veracidad y compromiso.
                        Nuestro equipo está conformado por estudiantes apasionados por la comunicación y la tecnología.
                    </p>
                </section>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">
                    <div className="glass p-8 rounded-2xl border border-white/5">
                        <h3 className="text-2xl font-bold mb-4 text-brand">Nuestra Misión</h3>
                        <p className="text-slate-300">
                            Fomentar el pensamiento crítico y la participación estudiantil a través de un periodismo ético y de calidad,
                            sirviendo como puente de comunicación en nuestra comunidad educativa.
                        </p>
                    </div>
                    <div className="glass p-8 rounded-2xl border border-white/5">
                        <h3 className="text-2xl font-bold mb-4 text-brand">Nuestra Visión</h3>
                        <p className="text-slate-300">
                            Convertirnos en el referente digital de información escolar, integrando nuevas tecnologías
                            para preservar la memoria histórica de nuestra institución.
                        </p>
                    </div>
                </div>

                <section>
                    <h3 className="text-3xl font-bold mb-8 text-center">Nuestro Equipo</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {[
                            { name: "Editor General", role: "Coordinación Editorial", icon: "✍️" },
                            { name: "Equipo de Redacción", role: "Investigación y Notas", icon: "📰" },
                            { name: "Diseño y Tech", role: "Plataforma Digital", icon: "💻" }
                        ].map((member, i) => (
                            <div key={i} className="glass p-6 rounded-xl text-center card-hover">
                                <div className="w-20 h-20 bg-slate-800 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl">
                                    {member.icon}
                                </div>
                                <h4 className="font-bold text-lg">{member.name}</h4>
                                <p className="text-brand text-sm">{member.role}</p>
                            </div>
                        ))}
                    </div>
                </section>
            </div>
        );

        const ContactPage = () => (
            <div className="animate-fade-in max-w-5xl mx-auto">
                <section className="mb-12 text-center md:text-left">
                    <h2 className="text-4xl md:text-6xl font-bold mb-4">
                        Ponte en <span className="gradient-text">Contacto</span>
                    </h2>
                    <p className="text-slate-400 text-lg">
                        ¿Tienes alguna duda, sugerencia o quieres colaborar con nosotros? Escríbenos.
                    </p>
                </section>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <div className="glass p-8 rounded-3xl border border-white/10">
                        <form className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label className="block text-sm font-medium text-slate-400 mb-2">Nombre</label>
                                    <input type="text" className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-brand transition-colors" placeholder="Tu nombre" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-slate-400 mb-2">Email</label>
                                    <input type="email" className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-brand transition-colors" placeholder="correo@ejemplo.com" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-400 mb-2">Asunto</label>
                                <input type="text" className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-brand transition-colors" placeholder="¿En qué podemos ayudarte?" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-400 mb-2">Mensaje</label>
                                <textarea className="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-brand transition-colors h-32" placeholder="Escribe tu mensaje aquí..."></textarea>
                            </div>
                            <button type="button" className="w-full bg-brand hover:bg-brand-dark text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-brand/20">
                                Enviar Mensaje
                            </button>
                        </form>
                    </div>

                    <div className="flex flex-col justify-center space-y-8">
                        <div className="flex items-start gap-4">
                            <div className="w-12 h-12 bg-brand/10 rounded-xl flex items-center justify-center text-brand text-2xl">📍</div>
                            <div>
                                <h4 className="font-bold text-lg">Ubicación</h4>
                                <p className="text-slate-400">Sede Escolar Central</p>
                            </div>
                        </div>
                        <div className="flex items-start gap-4">
                            <div className="w-12 h-12 bg-brand/10 rounded-xl flex items-center justify-center text-brand text-2xl">📧</div>
                            <div>
                                <h4 className="font-bold text-lg">Email</h4>
                                <p className="text-slate-400">contacto@elguardian.edu</p>
                            </div>
                        </div>
                        <div className="flex items-start gap-4">
                            <div className="w-12 h-12 bg-brand/10 rounded-xl flex items-center justify-center text-brand text-2xl">📱</div>
                            <div>
                                <h4 className="font-bold text-lg">Redes Sociales</h4>
                                <p className="text-slate-400">@elguardian_escolar</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const DiarioCard = ({ diario, onClick, isMas }) => {
            const firstTomo = diario.tomos && diario.tomos.length > 0 ? diario.tomos[0] : null;
            const coverPath = diario.portada || (firstTomo ? firstTomo.path : null);
            const hasImageCover = coverPath && !coverPath.toLowerCase().endsWith('.pdf');

            return (
                <div
                    className="glass rounded-2xl overflow-hidden card-hover cursor-pointer group animate-slide-up"
                    onClick={() => onClick(diario)}
                >
                    <div className="aspect-video overflow-hidden relative bg-slate-800 flex items-center justify-center">
                        {hasImageCover ? (
                            <img
                                src={coverPath}
                                alt={diario.name}
                                className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                            />
                        ) : (
                            <div className="text-6xl opacity-20 group-hover:scale-110 transition-transform duration-500">📰</div>
                        )}
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-60"></div>
                        <div className="absolute bottom-4 left-4 right-4">
                            <span className="bg-brand text-[10px] uppercase font-bold px-2 py-1 rounded mb-2 inline-block tracking-wider shadow-sm">
                                {diario.tomos.length} {isMas ? 'Archivos' : 'Tomos'}
                            </span>
                            <h3 className="text-2xl font-bold capitalize">{diario.name}</h3>
                        </div>
                    </div>
                    <div className="p-5">
                        <p className="text-slate-400 text-sm mb-4 line-clamp-2 italic">
                            {isMas ? `Explora los archivos de ${diario.name}.` : `Explora las ediciones de ${diario.name}.`}
                        </p>
                        <button className="text-brand font-semibold text-sm flex items-center gap-2 group/btn">
                            {isMas ? 'Ver Archivos' : 'Ver Tomos'}
                            <span className="group-hover/btn:translate-x-1 transition-transform">→</span>
                        </button>
                    </div>
                </div>
            );
        };

        const TomoCard = ({ tomo, onClick }) => {
            const isPdf = tomo.path.toLowerCase().endsWith('.pdf');
            return (
                <div
                    className="glass rounded-xl p-4 flex items-center gap-4 card-hover cursor-pointer group animate-slide-up"
                    onClick={() => onClick(tomo)}
                >
                    <div className="w-12 h-12 rounded-lg bg-slate-800 flex items-center justify-center text-2xl">
                        {isPdf ? '📄' : '🖼️'}
                    </div>
                    <div className="flex-1 overflow-hidden">
                        <h4 className="font-semibold truncate text-slate-200">{tomo.name}</h4>
                        <p className="text-xs text-slate-500 uppercase">{isPdf ? 'Documento PDF' : 'Imagen'}</p>
                    </div>
                    <div className="text-brand opacity-0 group-hover:opacity-100 transition-opacity">
                        →
                    </div>
                </div>
            );
        };

        const Viewer = ({ tomo, onBack }) => {
            const isPdf = tomo.path.toLowerCase().endsWith('.pdf');
            return (
                <div className="fixed inset-0 z-[60] bg-slate-950 animate-fade-in overflow-hidden flex flex-col">
                    <div className="glass p-4 flex items-center justify-between">
                        <button
                            onClick={onBack}
                            className="flex items-center gap-2 text-slate-300 hover:text-white transition-colors"
                        >
                            <span className="text-xl">←</span> Volver
                        </button>
                        <div className="text-center flex-1 mx-4">
                            <h2 className="font-bold truncate max-w-md">{tomo.name}</h2>
                        </div>
                        <div className="w-24 flex justify-end">
                            <a
                                href={tomo.path}
                                download
                                className="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded-md transition-colors"
                            >
                                Descargar
                            </a>
                        </div>
                    </div>
                    <div className="flex-1 bg-slate-900 overflow-auto flex items-center justify-center p-4">
                        {isPdf ? (
                            <iframe
                                src={tomo.path + "#toolbar=0"}
                                className="w-full h-full max-w-5xl rounded-lg shadow-2xl border-none"
                                title={tomo.name}
                            ></iframe>
                        ) : (
                            <img
                                src={tomo.path}
                                alt={tomo.name}
                                className="max-w-full max-h-full object-contain rounded-lg shadow-2xl"
                            />
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [diarios, setDiarios] = useState([]);
            const [masItems, setMasItems] = useState([]);
            const [currentView, setCurrentView] = useState('archive'); // 'archive', 'mas', 'about', 'contact'
            const [currentDiario, setCurrentDiario] = useState(null);
            const [selectedTomo, setSelectedTomo] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [busqueda, setBusqueda] = useState("");
            const [categoria, setCategoria] = useState("Todos");

            useEffect(() => {
                Promise.all([
                    fetch('diarios.json?v=' + Date.now())
                        .then(res => {
                            if (!res.ok) throw new Error('No se pudo cargar la base de datos de Diarios');
                            return res.json();
                        }),
                    fetch('mas.json?v=' + Date.now())
                        .then(res => {
                            if (!res.ok) {
                                console.warn('No se pudo cargar mas.json, usando listado vacío');
                                return [];
                            }
                            return res.json();
                        })
                        .catch(err => {
                            console.warn('Error al cargar mas.json:', err);
                            return [];
                        })
                ])
                .then(([diariosData, masData]) => {
                    setDiarios(diariosData || []);
                    setMasItems(masData || []);
                    setLoading(false);
                })
                .catch(err => {
                    console.error(err);
                    setError(err.message);
                    setLoading(false);
                });
            }, []);

            const limpiar = (texto) =>
                String(texto || "")
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .trim()
                    .toLowerCase();

            const itemsActivos = currentView === 'mas' ? masItems : diarios;

            const categoriasDisponibles = (() => {
                const cats = new Set(itemsActivos.map(item => item.categoria).filter(Boolean));
                return ["Todos", ...Array.from(cats).sort()];
            })();

            const diariosFiltrados = itemsActivos.filter((diario) => {
                const texto = limpiar(busqueda);
                const coincideBusqueda = limpiar(diario.name).includes(texto);
                const coincideCategoria =
                    limpiar(categoria) === "todos" ||
                    limpiar(diario.categoria) === limpiar(categoria);
                return coincideBusqueda && coincideCategoria;
            });

            const handleHome = () => {
                setSelectedTomo(null);
                setCurrentDiario(null);
                setCurrentView('archive');
                setBusqueda("");
                setCategoria("Todos");
            };

            const handleNavigate = (view) => {
                setSelectedTomo(null);
                setCurrentDiario(null);
                setCurrentView(view);
                setBusqueda("");
                setCategoria("Todos");
            };

            if (loading) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-slate-950">
                        <div className="w-12 h-12 border-4 border-brand border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p className="text-slate-400 font-medium">Cargando archivo digital...</p>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-slate-950 text-red-400 p-8 text-center">
                        <div>
                            <h2 className="text-2xl font-bold mb-2">Error</h2>
                            <p>{error}</p>
                            <button
                                onClick={() => window.location.reload()}
                                className="mt-4 bg-slate-800 px-4 py-2 rounded-lg text-white"
                            >
                                Reintentar
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    <Header
                        onHome={handleHome}
                        onNavigate={handleNavigate}
                        currentView={currentView}
                        currentDiario={currentDiario}
                    />

                    <main className="container mx-auto px-6 pt-32">
                        {selectedTomo && (
                            <Viewer
                                tomo={selectedTomo}
                                onBack={() => setSelectedTomo(null)}
                            />
                        )}

                        {currentView === 'about' && <AboutPage />}
                        {currentView === 'contact' && <ContactPage />}

                        {(currentView === 'archive' || currentView === 'mas') && !currentDiario && (
                            <div className="max-w-7xl mx-auto">
                                <section className="mb-6 flex flex-wrap justify-center gap-3">
                                    {categoriasDisponibles.map((cat) => (
                                        <button
                                            key={cat}
                                            onClick={() => setCategoria(cat)}
                                            className={`
                                                px-4 py-2 rounded-full text-sm font-semibold transition-all capitalize
                                                ${categoria === cat
                                                    ? 'bg-brand text-white'
                                                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}
                                            `}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </section>

                                <section className="mb-10 text-center">
                                    <input
                                        type="text"
                                        placeholder={currentView === 'mas' ? "Buscar contenido..." : "Buscar periódico..."}
                                        value={busqueda}
                                        onChange={(e) => setBusqueda(e.target.value)}
                                        className="w-full max-w-md mx-auto px-4 py-3 rounded-xl bg-slate-800 border border-slate-600 text-white"
                                    />
                                </section>
                                <p className="text-center text-slate-400 mb-6 text-sm">
                                    Categoría activa: <span className="capitalize">{categoria}</span> |
                                    {currentView === 'mas' ? 'Elementos' : 'Diarios'} cargados: {itemsActivos.length} |
                                    Mostrando: {diariosFiltrados.length}
                                </p>
                                <section className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {diariosFiltrados.map((diario, index) => (
                                        <DiarioCard
                                            key={index}
                                            diario={diario}
                                            onClick={setCurrentDiario}
                                            isMas={currentView === 'mas'}
                                        />
                                    ))}
                                </section>
                            </div>
                        )}

                        {(currentView === 'archive' || currentView === 'mas') && currentDiario && (
                            <div className="animate-fade-in">
                                <section className="mb-8 flex items-center justify-between">
                                    <div>
                                        <button
                                            onClick={() => setCurrentDiario(null)}
                                            className="text-brand hover:underline text-sm mb-2 block"
                                        >
                                            {currentView === 'mas' ? '← Volver a Más' : '← Volver a Diarios'}
                                        </button>
                                        <h2 className="text-3xl md:text-5xl font-bold capitalize">
                                            {currentDiario.name}
                                        </h2>
                                    </div>
                                    <div className="bg-slate-800/50 px-4 py-2 rounded-xl border border-white/5">
                                        <span className="text-slate-400 text-sm font-medium">
                                            {currentDiario.tomos.length} {currentView === 'mas' ? 'Archivos' : 'Ediciones'} encontrados
                                        </span>
                                    </div>
                                </section>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {currentDiario.tomos.map((tomo, index) => (
                                        <TomoCard
                                            key={index}
                                            tomo={tomo}
                                            onClick={setSelectedTomo}
                                        />
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {!selectedTomo && (
                        <footer className="mt-32 py-12 border-t border-slate-800/50 text-center text-slate-500 text-sm">
                            <p>© 2026 El Guardián - Diario Escolar</p>
                            <p className="mt-2 text-slate-600">Sistema Automatizado de Archivo</p>
                        </footer>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
